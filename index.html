<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chuyển Đổi File Đa Năng Chuyên Nghiệp</title>
    <!-- Tải các thư viện xử lý qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/npm/docx@8.5.0/build/index.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
            padding: 20px;
        }
        .main-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 580px;
            text-align: center;
        }
        .logo-area { font-size: 42px; margin-bottom: 5px; }
        h2 { color: #111827; font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        p.subtitle { color: #6b7280; margin-bottom: 20px; font-size: 13px; line-height: 1.4; }

        /* Thanh chọn chế độ */
        .mode-tabs {
            display: flex;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            color: #4b5563;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #4f46e5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Khung Upload */
        .upload-box {
            border: 2px dashed #6366f1;
            background: #f8fafc;
            padding: 30px 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            position: relative;
        }
        .upload-box:hover { background: #eef2ff; border-color: #4f46e5; }
        .upload-box input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; z-index: 10;
        }
        .upload-text { color: #4b5563; font-size: 14px; font-weight: 500; }
        .upload-text span { color: #4f46e5; text-decoration: underline; font-weight: 600; }

        #fileName {
            margin-bottom: 15px;
            font-size: 13px;
            color: #059669;
            font-weight: 600;
            word-break: break-all;
        }

        /* Nút hành động */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-submit:hover { opacity: 0.95; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }

        /* Nút Tải Xuống thủ công */
        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            transition: opacity 0.2s;
        }
        .btn-download:hover { opacity: 0.95; }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #4f46e5;
            font-weight: 600;
            word-break: break-word;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-area">⚡</div>
        <h2>Trình Chuyển Đổi File Thông Minh</h2>
        <p class="subtitle" id="subDesc">Chuyển đổi file giữ nguyên 100% định dạng, hình ảnh và bố cục chuẩn xác.</p>
        
        <!-- Thanh chọn chế độ -->
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="switchMode('pdf-to-ppt', event)">PDF ➔ PowerPoint</button>
            <button class="tab-btn" onclick="switchMode('pdf-to-word', event)">PDF ➔ Word</button>
            <button class="tab-btn" onclick="switchMode('doc-to-pdf', event)">Word/PPT ➔ PDF</button>
        </div>

        <!-- Khung Upload -->
        <div class="upload-box" id="dropZone">
            <input type="file" id="fileInput" accept=".pdf">
            <div class="upload-text" id="uploadLabel">📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span></div>
        </div>

        <div id="fileName"></div>
        
        <button id="convertBtn" class="btn-submit" onclick="startConversion()" disabled>Tiến Hành Chuyển Đổi Ngay</button>
        <button id="downloadBtn" class="btn-download" onclick="triggerDownload()">📥 Tải Xuống File Kết Quả</button>
        
        <div id="status"></div>
    </div>

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        let currentMode = 'pdf-to-ppt';
        let selectedFile = null;
        let generatedBlob = null;
        let outputFileName = "";

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDiv = document.getElementById('fileName');
        const statusDiv = document.getElementById('status');
        const subDesc = document.getElementById('subDesc');
        const uploadLabel = document.getElementById('uploadLabel');

        function switchMode(mode, event) {
            currentMode = mode;
            selectedFile = null;
            fileInput.value = "";
            fileNameDiv.textContent = "";
            convertBtn.disabled = true;
            downloadBtn.style.display = "none";
            statusDiv.textContent = "";

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'pdf-to-ppt') {
                subDesc.textContent = "Chuyển PDF sang Slide ngang 16:9, trang tài liệu nằm chính giữa, hai bên có lề trắng cân đối, chữ to rõ nét.";
                fileInput.accept = ".pdf";
                uploadLabel.innerHTML = '📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span>';
            } else if (mode === 'pdf-to-word') {
                subDesc.textContent = "Chuyển PDF sang Word (.docx) bằng cách nhúng từng trang thành ảnh gốc (Giữ nguyên 100% không vỡ chữ/công thức).";
                fileInput.accept = ".pdf";
                uploadLabel.innerHTML = '📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span>';
            } else if (mode === 'doc-to-pdf') {
                subDesc.textContent = "Chuyển tài liệu Word (.docx) sang định dạng xem PDF tiêu chuẩn.";
                fileInput.accept = ".docx,.doc,.pptx";
                uploadLabel.innerHTML = '📂 Kéo thả file Word/PPT vào đây hoặc <span>chọn file từ máy</span>';
            }
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDiv.textContent = "📄 Đã chọn: " + selectedFile.name;
                convertBtn.disabled = false;
                downloadBtn.style.display = "none";
                statusDiv.textContent = "";
            }
        });

        async function startConversion() {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            downloadBtn.style.display = "none";
            statusDiv.style.color = "#4f46e5";

            try {
                if (currentMode === 'pdf-to-ppt') {
                    await convertPdfToPptx();
                } else if (currentMode === 'pdf-to-word') {
                    await convertPdfToWord();
                } else if (currentMode === 'doc-to-pdf') {
                    await convertDocToPdf();
                }
            } catch (error) {
                console.error(error);
                statusDiv.style.color = "#dc2626";
                statusDiv.textContent = "❌ Lỗi xử lý: " + (error.message || "Vui lòng kiểm tra lại file đầu vào.");
                convertBtn.disabled = false;
            }
        }

        // 1. PDF sang PowerPoint (Slide ngang 16:9, trang PDF fit chiều cao, nằm chính giữa slide)
        async function convertPdfToPptx() {
            statusDiv.textContent = "Đang đọc file PDF...";
            const arrayBuffer = await selectedFile.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;
            const numPages = pdfDoc.numPages;

            let pptx = new PptxGenJS();
            const slideWidth = 10;
            const slideHeight = 5.625;
            pptx.defineLayout({ name: 'CUSTOM_16_9', width: slideWidth, height: slideHeight });
            pptx.layout = 'CUSTOM_16_9';

            for (let i = 1; i <= numPages; i++) {
                statusDiv.textContent = `Đang xử lý trang ${i} / ${numPages}...`;
                const page = await pdfDoc.getPage(i);
                
                const originalViewport = page.getViewport({ scale: 1.0 });
                const pdfWidth = originalViewport.width;
                const pdfHeight = originalViewport.height;

                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                const imgData = canvas.toDataURL('image/png');

                let imgRatio = pdfWidth / pdfHeight;
                let finalH = slideHeight;
                let finalW = slideHeight * imgRatio;
                let finalX = (slideWidth - finalW) / 2;
                let finalY = 0;

                let slide = pptx.addSlide();
                slide.background = { color: "FFFFFF" };
                
                slide.addImage({
                    data: imgData,
                    x: finalX,
                    y: finalY,
                    w: finalW,
                    h: finalH
                });
            }

            statusDiv.textContent = "Đang tạo file PowerPoint...";
            outputFileName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".pptx";
            generatedBlob = await pptx.write({ outputType: 'blob' });
            
            finalizeSuccess("Chuyển đổi sang PowerPoint thành công!");
        }

        // 2. PDF sang Word (Render ảnh từng trang đưa vào Word y hệt như bên PPT, giữ nguyên 100%)
        async function convertPdfToWord() {
            statusDiv.textContent = "Đang đọc file PDF để chuyển sang Word...";
            const arrayBuffer = await selectedFile.arrayBuffer();
            const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
            const pdfDoc = await loadingTask.promise;
            const numPages = pdfDoc.numPages;

            let docChildren = [];

            for (let i = 1; i <= numPages; i++) {
                statusDiv.textContent = `Đang xử lý trang ${i} / ${numPages}...`;
                const page = await pdfDoc.getPage(i);
                
                const originalViewport = page.getViewport({ scale: 1.0 });
                const pdfWidth = originalViewport.width;
                const pdfHeight = originalViewport.height;

                // Render chất lượng cao
                const viewport = page.getViewport({ scale: 2.0 });
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                await page.render({ canvasContext: context, viewport: viewport }).promise;
                
                const dataUrl = canvas.toDataURL('image/png');
                const blobBin = atob(dataUrl.split(',')[1]);
                let array = [];
                for (let j = 0; j < blobBin.length; j++) {
                    array.push(blobBin.charCodeAt(j));
                }
                const imageUint8Array = new Uint8Array(array);

                // Kích thước chuẩn hiển thị trong trang Word (Chiều rộng 460 pixel để khớp trang A4 gọn gàng)
                let renderWidth = 460;
                let renderHeight = (pdfHeight / pdfWidth) * renderWidth;

                // Thêm hình ảnh trang vào file Word, giữa các trang có ngắt trang (PageBreak) để phân trang rõ ràng
                let paragraphChildren = [
                    new docx.ImageRun({
                        data: imageUint8Array,
                        transformation: {
                            width: renderWidth,
                            height: renderHeight,
                        },
                    })
                ];

                // Nếu không phải trang cuối thì thêm ngắt trang để giống hệt tài liệu gốc
                if (i < numPages) {
                    paragraphChildren.push(new docx.PageBreak());
                }

                docChildren.push(
                    new docx.Paragraph({
                        children: paragraphChildren,
                        alignment: docx.AlignmentType.CENTER,
                        spacing: { after: 200 }
                    })
                );
            }

            statusDiv.textContent = "Đang xuất file Word (.docx)...";
            const doc = new docx.Document({
                sections: [{
                    properties: {},
                    children: docChildren,
                }],
            });

            generatedBlob = await docx.Packer.toBlob(doc);
            outputFileName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".docx";
            
            finalizeSuccess("Chuyển đổi sang Word thành công!");
        }

        // 3. Word sang PDF cơ bản
        async function convertDocToPdf() {
            statusDiv.textContent = "Đang đọc nội dung file Word...";
            const arrayBuffer = await selectedFile.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            let text = result.value;

            let printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <html>
                <head>
                    <title>${selectedFile.name}</title>
                    <style>
                        body { font-family: 'Times New Roman', Times, serif; padding: 40px; line-height: 1.6; font-size: 14pt; white-space: pre-wrap; }
                    </style>
                </head>
                <body>${text}</body>
                </html>
            `);
            printWindow.document.close();
            
            statusDiv.style.color = "#059669";
            statusDiv.textContent = "Đã mở cửa sổ bản in! Bạn hãy chọn 'Lưu dưới dạng PDF' (Save as PDF).";
            convertBtn.disabled = false;
        }

        function finalizeSuccess(msg) {
            statusDiv.style.color = "#059669";
            statusDiv.textContent = "✨ " + msg + " Bấm nút bên dưới để tải file về máy.";
            downloadBtn.style.display = "block";
            convertBtn.disabled = false;
        }

        function triggerDownload() {
            if (!generatedBlob) return;
            const url = URL.createObjectURL(generatedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = outputFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
