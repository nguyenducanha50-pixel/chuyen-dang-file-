<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển Đổi File PDF sang PowerPoint (Giữ nguyên định dạng)</title>
    <!-- Tải thư viện PDF.js và PptxGenJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
            padding: 20px;
        }
        .main-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 550px;
            text-align: center;
        }
        .logo-area { font-size: 48px; margin-bottom: 10px; }
        h2 { color: #111827; font-size: 24px; margin-bottom: 8px; font-weight: 700; }
        p.subtitle { color: #6b7280; margin-bottom: 25px; font-size: 14px; line-height: 1.5; }
        
        .upload-box {
            border: 2px dashed #6366f1;
            background: #f8fafc;
            padding: 30px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
        }
        .upload-box:hover { background: #eef2ff; border-color: #4f46e5; }
        .upload-box input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer;
        }
        .upload-text { color: #4b5563; font-size: 15px; font-weight: 500; }
        .upload-text span { color: #4f46e5; text-decoration: underline; }
        
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; }

        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #4f46e5;
            font-weight: 600;
        }
        #fileName {
            margin-top: 10px;
            font-size: 13px;
            color: #059669;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-area">📊</div>
        <h2>Chuyển Đổi PDF sang PowerPoint</h2>
        <p class="subtitle">Giữ nguyên 100% định dạng, font chữ, hình ảnh và bố cục gốc bằng công nghệ chuyển đổi ảnh chất lượng cao.</p>
        
        <div class="upload-box">
            <input type="file" id="pdfFile" accept="application/pdf">
            <div class="upload-text">Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span></div>
        </div>

        <div id="fileName"></div>
        <button id="convertBtn" class="btn-submit" onclick="convertPdfToPptx()" disabled>Chuyển Đổi Ngay</button>
        <div id="status"></div>
    </div>

    <script>
        // Cấu hình Worker cho PDF.js
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const fileInput = document.getElementById('pdfFile');
        const convertBtn = document.getElementById('convertBtn');
        const fileNameDiv = document.getElementById('fileName');
        const statusDiv = document.getElementById('status');
        let selectedFile = null;

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDiv.textContent = "Đã chọn: " + selectedFile.name;
                convertBtn.disabled = false;
                statusDiv.textContent = "";
            }
        });

        async function convertPdfToPptx() {
            if (!selectedFile) return;

            convertBtn.disabled = true;
            statusDiv.textContent = "Đang đọc file PDF...";

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const loadingTask = pdfjsLib.getDocument({ data: arrayBuffer });
                const pdfDoc = await loadingTask.promise;
                const numPages = pdfDoc.numPages;

                let pptx = new PptxGenJS();
                // Thiết lập kích thước slide tỷ lệ 16:9 chuẩn
                pptx.defineLayout({ name: 'CUSTOM_16_9', width: 10, height: 5.625 });
                pptx.layout = 'CUSTOM_16_9';

                for (let i = 1; i <= numPages; i++) {
                    statusDiv.textContent = `Đang xử lý trang ${i} / ${numPages}...`;
                    
                    const page = await pdfDoc.getPage(i);
                    // Phóng to 2x (scale: 2) để hình ảnh xuất ra sắc nét, không bị mờ vỡ khi phóng to trên PPT
                    const viewport = page.getViewport({ scale: 2.0 });
                    
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    
                    // Chuyển canvas thành định dạng ảnh PNG chất lượng cao
                    const imgData = canvas.toDataURL('image/png');

                    // Thêm slide mới và chèn ảnh phủ kín slide
                    let slide = pptx.addSlide();
                    slide.addImage({
                        data: imgData,
                        x: 0,
                        y: 0,
                        w: '100%',
                        h: '100%'
                    });
                }

                statusDiv.textContent = "Đang xuất file PowerPoint...";
                let outputName = selectedFile.name.replace(/\.[^/.]+$/, "") + ".pptx";
                await pptx.writeFile({ fileName: outputName });

                statusDiv.textContent = "Chuyển đổi thành công! File đã tự động tải xuống.";
            } catch (error) {
                console.error(error);
                statusDiv.textContent = "Có lỗi xảy ra: " + error.message;
            } finally {
                convertBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
