<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trình Chuyển Đổi File Đa Năng Chuyên Nghiệp</title>
    <!-- Tải các thư viện xử lý qua CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #1f2937;
            padding: 20px;
        }
        .main-card {
            background: #ffffff;
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 620px;
            text-align: center;
        }
        .logo-area { font-size: 42px; margin-bottom: 5px; }
        h2 { color: #111827; font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        p.subtitle { color: #6b7280; margin-bottom: 20px; font-size: 13px; line-height: 1.4; }

        /* Thanh chọn chế độ */
        .mode-tabs {
            display: flex;
            background: #f3f4f6;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 4px;
        }
        .tab-btn {
            flex: 1;
            min-width: 110px;
            padding: 10px 6px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            background: transparent;
            cursor: pointer;
            border-radius: 8px;
            color: #4b5563;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background: #ffffff;
            color: #4f46e5;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Khung Upload */
        .upload-box {
            border: 2px dashed #6366f1;
            background: #f8fafc;
            padding: 30px 20px;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 15px;
            position: relative;
        }
        .upload-box:hover { background: #eef2ff; border-color: #4f46e5; }
        .upload-box input[type="file"] {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; z-index: 10;
        }
        .upload-text { color: #4b5563; font-size: 14px; font-weight: 500; }
        .upload-text span { color: #4f46e5; text-decoration: underline; font-weight: 600; }

        #fileName {
            margin-bottom: 15px;
            font-size: 13px;
            color: #059669;
            font-weight: 600;
            word-break: break-all;
        }

        /* Khu vực xem trước & xử lý ảnh */
        #imageWorkspace {
            display: none;
            margin-bottom: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
        }
        .preview-container {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .preview-box {
            flex: 1;
            background: #111827;
            border-radius: 10px;
            padding: 8px;
            text-align: center;
        }
        .preview-box span {
            display: block;
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        canvas {
            width: 100%;
            max-height: 240px;
            height: auto;
            border-radius: 4px;
            object-fit: contain;
        }

        .controls-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn-process {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            color: white;
            border: none;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-process:hover { opacity: 0.9; }

        /* Nút hành động chung */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-submit:hover { opacity: 0.95; }
        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { background: #9ca3af; cursor: not-allowed; transform: none; }

        .btn-download {
            width: 100%;
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            transition: opacity 0.2s;
        }
        .btn-download:hover { opacity: 0.95; }

        #status {
            margin-top: 15px;
            font-size: 13px;
            color: #4f46e5;
            font-weight: 600;
            word-break: break-word;
            min-height: 20px;
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-area">⚡</div>
        <h2>Trình Chuyển Đổi File Thông Minh</h2>
        <p class="subtitle" id="subDesc">Chuyển đổi file giữ nguyên 100% định dạng, hình ảnh và bố cục chuẩn xác.</p>
        
        <!-- Thanh chọn chế độ -->
        <div class="mode-tabs">
            <button class="tab-btn active" onclick="switchMode('pdf-to-ppt', event)">PDF ➔ PowerPoint</button>
            <button class="tab-btn" onclick="switchMode('pdf-to-word', event)">PDF ➔ Word</button>
            <button class="tab-btn" onclick="switchMode('doc-to-pdf', event)">Word/PPT ➔ PDF</button>
            <button class="tab-btn" onclick="switchMode('img-upscale', event)">✨ Banna Hub AI HD</button>
        </div>

        <!-- Khung Upload -->
        <div class="upload-box" id="dropZone">
            <input type="file" id="fileInput" accept=".pdf">
            <div class="upload-text" id="uploadLabel">📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span></div>
        </div>

        <div id="fileName"></div>

        <!-- Khu vực so sánh Trước & Sau (Dành riêng cho Làm Nét Ảnh) -->
        <div id="imageWorkspace">
            <div class="preview-container">
                <div class="preview-box">
                    <span>ẢNH GỐC BAN ĐẦU</span>
                    <canvas id="originalCanvas"></canvas>
                </div>
                <div class="preview-box">
                    <span>ẢNH SAU KHI XỬ LÝ AI</span>
                    <canvas id="processedCanvas"></canvas>
                </div>
            </div>
            <div class="controls-area">
                <button class="btn-process" onclick="runAIProcessingPipeline()">🚀 Chạy Quá Trình Phân Tích & Làm Nét Siêu Cấp</button>
            </div>
        </div>
        
        <button id="convertBtn" class="btn-submit" onclick="startConversion()" disabled>Tiến Hành Chuyển Đổi Ngay</button>
        <button id="downloadBtn" class="btn-download" onclick="triggerDownload()">📥 Tải Xuống File Kết Quả</button>
        
        <div id="status"></div>
    </div>

    <script>
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        let currentMode = 'pdf-to-ppt';
        let selectedFile = null;
        let generatedBlob = null;
        let outputFileName = "";
        let rawImageObj = null; // Lưu cố định ảnh gốc tải lên

        const fileInput = document.getElementById('fileInput');
        const convertBtn = document.getElementById('convertBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileNameDiv = document.getElementById('fileName');
        const statusDiv = document.getElementById('status');
        const subDesc = document.getElementById('subDesc');
        const uploadLabel = document.getElementById('uploadLabel');

        const imageWorkspace = document.getElementById('imageWorkspace');
        const originalCanvas = document.getElementById('originalCanvas');
        const processedCanvas = document.getElementById('processedCanvas');
        const origCtx = originalCanvas.getContext('2d');
        const procCtx = processedCanvas.getContext('2d');

        function switchMode(mode, event) {
            currentMode = mode;
            selectedFile = null;
            rawImageObj = null;
            fileInput.value = "";
            fileNameDiv.textContent = "";
            convertBtn.disabled = true;
            downloadBtn.style.display = "none";
            imageWorkspace.style.display = "none";
            statusDiv.textContent = "";

            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (mode === 'pdf-to-ppt') {
                subDesc.textContent = "Chuyển PDF sang PowerPoint chuẩn tỷ lệ A4 dọc tuyệt đối, tràn viền đẹp mắt.";
                fileInput.accept = ".pdf";
                uploadLabel.innerHTML = '📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span>';
                convertBtn.style.display = "block";
            } else if (mode === 'pdf-to-word') {
                subDesc.textContent = "Chuyển PDF sang Word (.doc) giữ nguyên vẹn bố cục ảnh chụp chuẩn mực.";
                fileInput.accept = ".pdf";
                uploadLabel.innerHTML = '📂 Kéo thả file PDF vào đây hoặc <span>chọn file từ máy</span>';
                convertBtn.style.display = "block";
            } else if (mode === 'doc-to-pdf') {
                subDesc.textContent = "Chuyển tài liệu Word (.docx) sang định dạng xem PDF tiêu chuẩn.";
                fileInput.accept = ".docx,.doc,.pptx";
                uploadLabel.innerHTML = '📂 Kéo thả file Word/PPT vào đây hoặc <span>chọn file từ máy</span>';
                convertBtn.style.display = "block";
            } else if (mode === 'img-upscale') {
                subDesc.textContent = "Banna Hub AI: Đưa ảnh qua quy trình xử lý chuyên sâu, tái tạo chi tiết và làm rõ nét hoàn toàn.";
                fileInput.accept = "image/*";
                uploadLabel.innerHTML = '🖼️ Kéo thả hình ảnh gốc vào đây hoặc <span>chọn ảnh từ máy</span>';
                convertBtn.style.display = "none";
            }
        }

        fileInput.addEventListener('change', function(e) {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                fileNameDiv.textContent = "📄 Đã chọn: " + selectedFile.name;
                downloadBtn.style.display = "none";
                statusDiv.textContent = "";

                if (currentMode === 'img-upscale') {
                    loadRawImageToWorkspace(selectedFile);
                } else {
                    convertBtn.disabled = false;
                }
            }
        });

        // 1. Tải và hiển thị ảnh gốc cố định lên khung bên trái
        function loadRawImageToWorkspace(file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                rawImageObj = new Image();
                rawImageObj.onload = function() {
                    imageWorkspace.style.display = "block";
                    
                    // Vẽ lên khung gốc
                    originalCanvas.width = rawImageObj.width;
                    originalCanvas.height = rawImageObj.height;
                    origCtx.drawImage(rawImageObj, 0, 0);

                    // Hiển thị tạm ảnh gốc sang khung xử lý để người dùng thấy trước
                    processedCanvas.width = rawImageObj.width;
                    processedCanvas.height = rawImageObj.height;
                    procCtx.drawImage(rawImageObj, 0, 0);

                    statusDiv.style.color = "#4f46e5";
                    statusDiv.textContent = "✨ Đã tải ảnh gốc thành công. Hãy bấm nút 'Chạy Quá Trình Phân Tích & Làm Nét' ở trên!";
                };
                rawImageObj.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        // 2. Quy trình xử lý qua các bước giả lập AI rõ ràng
        async function runAIProcessingPipeline() {
            if (!rawImageObj) return;

            statusDiv.style.color = "#4f46e5";
            statusDiv.textContent = "⏳ Bước 1/3: Đang phân tích ma trận điểm ảnh và phát hiện biên...";
            await sleep(600);

            statusDiv.textContent = "⚙️ Bước 2/3: Đang khử nhiễu hạt và tăng tương phản màu sắc (Banna Hub Engine)...";
            await sleep(800);

            // Tiến hành xử lý thật trên Canvas bên phải
            const targetWidth = Math.min(rawImageObj.width * 2, 2560);
            const targetHeight = Math.min(rawImageObj.height * 2, 1440);

            processedCanvas.width = targetWidth;
            processedCanvas.height = targetHeight;

            procCtx.imageSmoothingEnabled = true;
            procCtx.imageSmoothingQuality = 'high';
            procCtx.drawImage(rawImageObj, 0, 0, targetWidth, targetHeight);

            // Áp dụng bộ lọc nâng cao giúp vạch màu, chữ viết sắc sảo
            applyBannaHubDeepEnhance(procCtx, targetWidth, targetHeight);

            statusDiv.textContent = "🎉 Bước 3/3: Hoàn tất quá trình tối ưu hóa siêu nét!";
            
            processedCanvas.toBlob(function(blob) {
                generatedBlob = blob;
                outputFileName = selectedFile.name.replace(/\.[^/.]+$/, "") + "-BannaHub-SuperHD.png";
                finalizeSuccess("Đã xử lý làm nét thành công toàn bộ chi tiết so với ảnh gốc!");
            }, 'image/png');
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Thuật toán khuếch đại biên mạnh mẽ tách bạch chi tiết
        function applyBannaHubDeepEnhance(context, width, height) {
            const imageData = context.getImageData(0, 0, width, height);
            const src = imageData.data;
            const w = imageData.width;
            const h = imageData.height;

            for (let y = 1; y < h - 1; y++) {
                for (let x = 1; x < w - 1; x++) {
                    const idx = (y * w + x) * 4;

                    for (let c = 0; c < 3; c++) {
                        const current = src[idx + c];
                        const top = src[((y - 1) * w + x) * 4 + c];
                        const bottom = src[((y + 1) * w + x) * 4 + c];
                        const left = src[(y * w + (x - 1)) * 4 + c];
                        const right = src[(y * w + (x + 1)) * 4 + c];

                        const blurred = (top + bottom + left + right) / 4;
                        let newVal = current + (current - blurred) * 0.85; // Tăng cường độ nét biên mạnh

                        // Cân chỉnh độ tương phản sâu
                        if (newVal > 128) {
                            newVal += (newVal - 128) * 0.15;
                        } else {
                            newVal -= (128 - newVal) * 0.15;
                        }

                        src[idx + c] = Math.min(255, Math.max(0, newVal));
                    }
                }
            }
            context.putImageData(imageData, 0, 0);
        }

        async function startConversion() {
            if (!selectedFile) return;
            convertBtn.disabled = true;
            downloadBtn.style.display = "none";
            statusDiv.style.color = "#4f46e5";

            try {
                if (currentMode === 'pdf-to-ppt') await convertPdfToPptx();
                else if (currentMode === 'pdf-to-word') await convertPdfToWord();
                else if (currentMode === 'doc-to-pdf') await convertDocToPdf();
            } catch (error) {
                statusDiv.style.color = "#dc2626";
                statusDiv.textContent = "❌ Lỗi xử lý: " + (error.message || "Vui lòng kiểm tra lại file.");
                convertBtn.disabled = false;
            }
        }

        async function convertPdfToPptx() { /* Giữ nguyên logic cũ */ }
        async function convertPdfToWord() { /* Giữ nguyên logic cũ */ }
        async function convertDocToPdf() { /* Giữ nguyên logic cũ */ }

        function finalizeSuccess(msg) {
            statusDiv.style.color = "#059669";
            statusDiv.textContent = "✨ " + msg + " Bấm nút bên dưới để tải ảnh Full HD về máy.";
            downloadBtn.style.display = "block";
        }

        function triggerDownload() {
            if (!generatedBlob) return;
            const url = URL.createObjectURL(generatedBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = outputFileName;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
